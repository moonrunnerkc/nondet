<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="nondet: find the line where a JVM run stops being reproducible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#11182b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#1c2740" stroke-width="1"/>

  <!-- text block -->
  <text x="82" y="78" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="5" fill="#5a6b86">JVM NONDETERMINISM DETECTOR</text>
  <text x="74" y="170" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#e9eef5">nondet</text>
  <rect x="80" y="190" width="210" height="6" rx="3" fill="url(#accent)"/>
  <text x="82" y="238" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" fill="#9fb0c3">Find where a JVM run stops being reproducible.</text>
  <text x="82" y="286" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="21" fill="#7d8aa0">nondet check  &#8594;  first divergence at read <tspan fill="#3fb950">#0</tspan></text>

  <!-- divergence panel -->
  <rect x="720" y="70" width="408" height="220" rx="14" fill="#0e1626" stroke="#1f2940" stroke-width="1"/>
  <g stroke="#16203a" stroke-width="1">
    <line x1="792" y1="86" x2="792" y2="274"/>
    <line x1="864" y1="86" x2="864" y2="274"/>
    <line x1="936" y1="86" x2="936" y2="274"/>
    <line x1="1008" y1="86" x2="1008" y2="274"/>
    <line x1="1080" y1="86" x2="1080" y2="274"/>
  </g>

  <!-- shared path, then the split -->
  <polyline points="748,182 790,166 832,178 874,160 905,170" fill="none" stroke="#8893a8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#8893a8">
    <circle cx="748" cy="182" r="3"/>
    <circle cx="790" cy="166" r="3"/>
    <circle cx="832" cy="178" r="3"/>
    <circle cx="874" cy="160" r="3"/>
  </g>
  <polyline points="905,170 945,150 992,128 1045,108 1100,100" fill="none" stroke="#3fb950" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="905,170 945,190 992,212 1045,236 1100,248" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- divergence marker -->
  <line x1="905" y1="104" x2="905" y2="256" stroke="#2b3b59" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="905" cy="170" r="7" fill="none" stroke="#e9eef5" stroke-width="2"/>
  <circle cx="905" cy="170" r="3.5" fill="#e9eef5"/>
  <text x="905" y="98" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" letter-spacing="1" fill="#c9d6e5">divergence</text>

  <circle cx="1100" cy="100" r="4" fill="#3fb950"/>
  <circle cx="1100" cy="248" r="4" fill="#58a6ff"/>
  <text x="1096" y="92" text-anchor="end" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#3fb950">run A</text>
  <text x="1096" y="268" text-anchor="end" font-family="'SFMono-Regular', Consolas, Menlo, monospace" font-size="13" fill="#58a6ff">run B</text>
</svg>
